name: Build and publish Windows desktop release

on:
  push:
    tags:
      - 'v2.2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v2.2.2

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python backend dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.14.2
      - name: Package the local monitoring service
        run: >-
          pyinstaller --noconfirm --clean --onedir --noconsole --name pyTOP-Backend
          --add-data "templates;templates" --add-data "static;static" app.py
      - name: Bundle backend for Electron
        run: Copy-Item -Recurse -Force dist/pyTOP-Backend electron/backend
      - name: Install Electron build dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund
      - name: Build the single Windows installer
        working-directory: electron
        run: npm run dist:win
      - name: Publish pyTOP Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: pyTOP ${{ github.event.inputs.tag || github.ref_name }} — Windows Desktop
          body: |
            pyTOP ${{ github.event.inputs.tag || github.ref_name }} Windows masaüstü sürümü.

            ${{ github.event.inputs.tag || github.ref_name }}: Uygulama içi otomatik güncelleme, arka plan sürüm kontrolü ve onaylı indirme/kurulum.
            Windows 10/11 Electron kurulum dosyasının yanında güncelleyicinin doğrulama manifesti ve blok haritaları bulunur. Python kurulumu gerekmez.
          draft: false
          prerelease: false
          files: |
            electron/dist/*.exe
            electron/dist/*.yml
            electron/dist/*.blockmap
