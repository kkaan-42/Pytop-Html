name: Build and publish desktop releases

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v2.3.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set app version from release tag
        run: python scripts/sync_release_version.py "${{ github.event.inputs.tag || github.ref_name }}"
      - name: Install Python backend dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.14.2
      - name: Package the local monitoring service
        run: >-
          pyinstaller --noconfirm --clean --onedir --noconsole --name pyTOP-Backend
          --add-data "templates;templates" --add-data "static;static" app.py
      - name: Bundle backend for Electron
        run: Copy-Item -Recurse -Force dist/pyTOP-Backend electron/backend
      - name: Install Electron build dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund
      - name: Build Windows installer and updater files
        working-directory: electron
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            electron/dist/*.exe
            electron/dist/latest*.yml
            electron/dist/*.blockmap
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set app version from release tag
        run: python scripts/sync_release_version.py "${{ github.event.inputs.tag || github.ref_name }}"
      - name: Install Python backend dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.14.2
      - name: Install AppImage build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
      - name: Package the local monitoring service
        run: >-
          pyinstaller --noconfirm --clean --onedir --name pyTOP-Backend
          --add-data "templates:templates" --add-data "static:static" app.py
      - name: Bundle backend for Electron
        run: cp -R dist/pyTOP-Backend electron/backend
      - name: Install Electron build dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund
      - name: Build Linux AppImage and Debian packages
        working-directory: electron
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/latest*.yml
            electron/dist/*.blockmap
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true
      - name: Prepare release notes
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # release-notes/<tag>.md varsa onu kullan (önce etiketteki, sonra main'deki kopya);
          # yoksa genel masaüstü sürüm metnine geri dön.
          if [ -f "release-notes/$TAG.md" ]; then
            cp "release-notes/$TAG.md" RELEASE_BODY.md
          elif git fetch --depth=1 origin main && git show "FETCH_HEAD:release-notes/$TAG.md" > RELEASE_BODY.md 2>/dev/null; then
            :
          else
            cat > RELEASE_BODY.md <<EOF
          pyTOP $TAG masaüstü sürümü.

          Windows: Electron NSIS kurulum dosyası ve güncelleme manifesti.
          Linux: AppImage (x86_64, uygulama içi güncelleme destekli) ve Debian/Ubuntu \`.deb\` paketi.
          Paketler Python kurulumu gerektirmez.
          EOF
          fi
      - name: Publish one cross-platform release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: pyTOP ${{ github.event.inputs.tag || github.ref_name }} — Windows & Linux
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: |
            release-assets/*
            install-server.sh
